<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ bot_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .chat-container {
    width: 460px;
    max-width: 92vw;
    height: 640px;
    max-height: 82vh;
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow-panel);
  }
  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: var(--surface-alt);
    gap: 10px;
  }
  .chat-header .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .chat-header .logout {
    font-size: 12.5px; font-weight: 500; color: var(--muted);
    text-decoration: none; border: 1px solid var(--line-strong); border-radius: var(--radius-pill);
    padding: 6px 12px; white-space: nowrap;
  }
  .chat-header .logout:hover { color: var(--kiwi-green); border-color: var(--kiwi-green); }
  .mode-row { padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--surface-alt); }
  .messages { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 11px 15px; border-radius: 16px; font-size: 14px; line-height: 1.45; }
  .msg:has(.msg-code) { max-width: 94%; }
  .msg:has(.msg-image) { max-width: 90%; padding: 8px; }
  .msg.user {
    align-self: flex-end; background: var(--accent-gradient); color: #06070C; font-weight: 500;
    border-bottom-right-radius: 5px;
  }
  .msg.bot {
    align-self: flex-start; background: var(--surface-alt); border: 1px solid var(--line-strong);
    color: var(--ink); border-bottom-left-radius: 5px;
  }
  .msg.notice {
    align-self: flex-start; background: var(--amber-soft); border: 1px solid var(--amber);
    color: #F5C066; border-bottom-left-radius: 5px; font-size: 13px;
  }
  .msg .meta { display: block; margin-top: 5px; font-size: 10.5px; color: var(--muted); }
  .msg.user .meta { color: rgba(6,7,12,0.65); }
  .input-row { display: flex; padding: 16px; gap: 8px; border-top: 1px solid var(--line); }
  .input-row input[type=text] { flex: 1; margin: 0; }
  .input-row button.primary { width: auto; padding: 0 20px; margin: 0; }
  .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--kiwi-green);
    animation: typing-bounce 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; background: var(--kiwi-bright); }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
</style>
</head>
<body>

<div class="page-body">
  <div class="chat-container">
    <div class="chat-header">
      <div>
        {% include '_brand.html' %}
        <div class="sub">{{ bot_name }} · Signed in as {{ username }}</div>
      </div>
      <a class="logout" href="/logout">Log out</a>
    </div>
    <div class="mode-row">
      <div class="mode-selector">
        <button class="mode-btn active" id="mode-general" onclick="setMode('general')">General</button>
        <button class="mode-btn" id="mode-coding" onclick="setMode('coding')">Code</button>
        <button class="mode-btn" id="mode-image" onclick="setMode('image')">Image</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
      <button class="primary" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  &copy; {{ copyright_year }} {{ brand }}. All rights reserved.
  <a href="/terms">Terms of Use</a> · <a href="/privacy">Privacy Policy</a>
</footer>

<script src="{{ url_for('static', filename='cookie-consent.js') }}"></script>
<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
let currentMode = 'general';

const modeGreetings = {
  general: "Hi! I'm {{ bot_name }}. Ask me anything.",
  coding: "Code mode. Ask a programming question and I'll answer with working code.",
  image: "Image mode. Describe what you'd like me to generate."
};
const modePlaceholders = {
  general: "Type a message...",
  coding: "Ask a coding question...",
  image: "Describe an image to generate..."
};

function setMode(mode) {
  currentMode = mode;
  ['general', 'coding', 'image'].forEach(m => {
    document.getElementById('mode-' + m).classList.toggle('active', m === mode);
  });
  inputEl.placeholder = modePlaceholders[mode];
  addMessage(modeGreetings[mode], 'notice');
}

function addMessage(text, sender, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;

  if (text.includes('\n') && sender === 'bot') {
    const pre = document.createElement('pre');
    pre.className = 'msg-code';
    pre.textContent = text;
    div.appendChild(pre);
  } else {
    div.appendChild(document.createTextNode(text));
  }

  if (meta) {
    const metaEl = document.createElement('span');
    metaEl.className = 'meta';
    metaEl.textContent = meta;
    div.appendChild(metaEl);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addImageMessage(base64Data) {
  const div = document.createElement('div');
  div.className = 'msg bot';
  const img = document.createElement('img');
  img.className = 'msg-image';
  img.src = 'data:image/png;base64,' + base64Data;
  div.appendChild(img);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-indicator';
  div.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  inputEl.value = '';
  addTypingIndicator();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, mode: currentMode })
    });
    removeTypingIndicator();
    if (res.status === 401) {
      window.location.href = '/login';
      return;
    }
    const data = await res.json();

    if (data.image_b64) {
      addImageMessage(data.image_b64);
    } else if (data.config_error || data.request_error) {
      addMessage(data.response, 'notice');
    } else if (data.response) {
      addMessage(data.response, 'bot', data.mode ? `mode: ${data.mode}` : '');
    } else if (data.error) {
      addMessage(data.error, 'notice');
    }
  } catch (err) {
    removeTypingIndicator();
    addMessage("Error reaching the server.", 'notice');
  }
}

inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

addMessage(modeGreetings.general, 'bot');
</script>

</body>
</html>
