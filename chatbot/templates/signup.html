<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign up · {{ brand }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page-center">
  <div class="card">
    {% include '_brand.html' %}
    <h2>Create an account</h2>
    <p>By signing up you agree to our <a href="/terms">Terms of Use</a> and <a href="/privacy">Privacy Policy</a>.</p>

    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username">

    <label for="email">Email (optional — used for login verification codes)</label>
    <input type="email" id="email" autocomplete="email">

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="new-password" onkeydown="if(event.key==='Enter') doSignup()">
    <p style="margin-top:6px;">At least 6 characters.</p>

    <button class="primary" onclick="doSignup()">Sign up</button>
    <div class="error" id="error"></div>

    <div class="switch-link">Already have an account? <a href="/login">Log in</a></div>
  </div>
</div>

<footer class="site-footer">
  &copy; {{ copyright_year }} {{ brand }}. All rights reserved.
  <a href="/terms">Terms of Use</a> · <a href="/privacy">Privacy Policy</a>
</footer>

<script src="{{ url_for('static', filename='cookie-consent.js') }}"></script>
<script>
async function doSignup() {
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';

  if (!username || !password) {
    errorEl.textContent = 'Username and password are required.';
    return;
  }

  const res = await fetch('/api/signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, email, password })
  });
  const data = await res.json();
  if (data.ok) {
    window.location.href = '/';
  } else {
    errorEl.textContent = data.error || 'Signup failed';
  }
}
</script>

</body>
</html>
